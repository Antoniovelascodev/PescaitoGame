<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PescaitoGame">
<meta name="theme-color" content="#0b4a78">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="PescaitoGame: juego de pesca por el Mediterráneo vista desde arriba. Pesca desde la orilla, el espigón, la tabla de paddle y bucea con arpón.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>PescaitoGame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="joyzone"></div>
<div id="joy"><div id="joyknob"></div></div>

<div id="hud">
  <div class="wood clockbox" id="hClock">
    <img class="pxi" id="hClockIc" alt="">
    <div class="ct"><b id="hTime">08:00</b><span id="hDate">Día 1</span></div>
  </div>
  <div class="wood moneybox" id="hMoney"><img class="pxi" id="hMoneyIc" alt=""><b id="hMoneyV">0 €</b></div>
  <div class="chips">
    <div class="wood hchip" id="hBait"><img class="pxi" alt=""><b></b></div>
    <div class="wood hchip" id="hCool"><img class="pxi" alt=""><b></b></div>
    <div class="wood hchip" id="hGems"><img class="pxi" alt=""><b></b></div>
    <div class="wood hchip" id="hSwell"><img class="pxi" alt=""><b></b></div>
  </div>
  <div class="wood quest" id="hQuest"><img class="pxi" alt=""><span></span></div>
  <div id="hSpot" class="spot"></div>
</div>
<div id="moneyPops"></div>
<div id="hudR">
  <button class="wood round" id="btnMap" aria-label="Mapa"></button>
  <button class="wood round" id="btnMenu" aria-label="Ajustes"></button>
  <button class="wood round" id="btnZoomIn" aria-label="Acercar"></button>
  <button class="wood round" id="btnZoomOut" aria-label="Alejar"></button>
</div>

<div id="fishhud" class="hidden"></div>

<div id="actions">
  <button class="act ctx hidden" id="btnCtx"></button>
  <div class="actrow">
    <button class="act small" id="btnInv"><span class="ic">🎒</span><span class="lb">Inventario</span></button>
    <button class="act small" id="btnShop"><span class="ic">🏪</span><span class="lb">Tienda</span></button>
  </div>
  <button class="act big" id="btnCast"><span class="ic">🎣</span><span class="lb">LANZAR</span></button>
</div>

<div id="toasts"></div>
<div id="modal" class="hidden"></div>
<div id="dive" class="hidden"></div>

<div id="title">
  <div class="tbox">
    <div class="logo">🎣</div>
    <h1>PescaitoGame</h1>
    <p class="sub">Del espigón al mar abierto: colecciona todas las especies del Mediterráneo.</p>
    <button class="btn primary" id="btnPlay">Jugar</button>
    <button class="btn ghost hidden" id="btnNew">Empezar de nuevo</button>
    <p class="tip" id="installTip"></p>
  </div>
</div>

<div id="rotate" class="hidden">Gira el móvil o juega en vertical: la vista se adapta 🙂</div>

<script src="js/data.js"></script>
<script src="js/species2.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/tex.js"></script>
<script src="js/pixart.js"></script>
<script src="js/fishart.js"></script>
<script src="js/icons.js"></script>
<script src="js/player.js"></script>
<script src="js/world.js"></script>
<script src="js/valle.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/fishing.js"></script>
<script src="js/ui.js"></script>
<script src="js/meta.js"></script>
<script src="js/quests.js"></script>
<script src="js/home.js"></script>
<script src="js/shops.js"></script>
<script src="js/stall.js"></script>
<script src="js/interior.js"></script>
<script src="js/social.js"></script>
<script src="js/dive.js"></script>
<script src="js/main.js"></script>
</body>
</html>
